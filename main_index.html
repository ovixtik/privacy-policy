<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سياسات الخصوصية — Ovixtik Apps</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --gold: #d4af37;
    --dark: #0f1220;
    --dark2: #1a1f35;
    --dark3: #222840;
    --text: #e8e8f0;
    --muted: #8890aa;
  }
  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'Cairo', sans-serif;
    min-height: 100vh;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(212,175,55,0.07) 0%, transparent 60%);
    pointer-events: none;
  }
  .container { max-width: 700px; margin: 0 auto; padding: 0 24px; position: relative; z-index: 1; }

  header { padding: 60px 0 40px; text-align: center; }
  .dev-badge {
    display: inline-block;
    background: rgba(212,175,55,0.1);
    border: 1px solid rgba(212,175,55,0.25);
    color: var(--gold);
    font-size: 12px;
    padding: 4px 14px;
    border-radius: 20px;
    margin-bottom: 20px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  header h1 { font-size: 32px; font-weight: 900; color: #fff; margin-bottom: 8px; }
  header h1 span { color: var(--gold); }
  header p { color: var(--muted); font-size: 15px; font-weight: 300; }

  .apps-grid {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin: 48px 0;
  }

  .app-card {
    background: var(--dark2);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 16px;
    padding: 20px 24px;
    display: flex;
    align-items: center;
    gap: 18px;
    text-decoration: none;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .app-card::before {
    content: '';
    position: absolute;
    right: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--card-color, var(--gold));
    border-radius: 0 16px 16px 0;
  }
  .app-card:hover {
    border-color: rgba(212,175,55,0.25);
    transform: translateX(-3px);
    background: var(--dark3);
  }

  .app-icon {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    flex-shrink: 0;
    background: var(--icon-bg, rgba(212,175,55,0.12));
  }

  .app-info { flex: 1; }
  .app-name { font-size: 17px; font-weight: 700; color: #fff; margin-bottom: 3px; }
  .app-desc { font-size: 13px; color: var(--muted); }

  .app-status {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 20px;
    flex-shrink: 0;
  }
  .status-live { background: rgba(16,185,129,0.15); color: #10b981; border: 1px solid rgba(16,185,129,0.25); }
  .status-soon { background: rgba(255,255,255,0.06); color: var(--muted); border: 1px solid rgba(255,255,255,0.1); }

  .arrow { color: var(--muted); font-size: 18px; flex-shrink: 0; }

  footer {
    text-align: center;
    padding: 32px 0 48px;
    border-top: 1px solid rgba(255,255,255,0.05);
  }
  footer p { font-size: 13px; color: rgba(255,255,255,0.2); }
  footer strong { color: rgba(255,255,255,0.35); }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="dev-badge">Ovixtik Apps</div>
    <h1>سياسات <span>الخصوصية</span></h1>
    <p>Privacy Policies for all our applications</p>
  </header>

  <div class="apps-grid">

    <!-- InvoTik — LIVE -->
    <a href="./invotik/" class="app-card" style="--card-color:#d4af37; --icon-bg:rgba(212,175,55,0.12);">
      <div class="app-icon">🧾</div>
      <div class="app-info">
        <div class="app-name">InvoTik</div>
        <div class="app-desc">تطبيق إدارة الفواتير والعملاء</div>
      </div>
      <span class="app-status status-live">منشور</span>
      <span class="arrow">←</span>
    </a>

    <!-- HesabTik -->
    <a href="./hesabtik/" class="app-card" style="--card-color:#10b981; --icon-bg:rgba(16,185,129,0.1);">
      <div class="app-icon">📊</div>
      <div class="app-info">
        <div class="app-name">HesabTik</div>
        <div class="app-desc">تطبيق المحاسبة والحسابات</div>
      </div>
      <span class="app-status status-soon">قريباً</span>
      <span class="arrow">←</span>
    </a>

    <!-- App 2 -->
    <a href="./app2/" class="app-card" style="--card-color:#6366f1; --icon-bg:rgba(99,102,241,0.1);">
      <div class="app-icon">📱</div>
      <div class="app-info">
        <div class="app-name">App 2</div>
        <div class="app-desc">قريباً</div>
      </div>
      <span class="app-status status-soon">قريباً</span>
      <span class="arrow">←</span>
    </a>

    <!-- App 3 -->
    <a href="./app3/" class="app-card" style="--card-color:#f59e0b; --icon-bg:rgba(245,158,11,0.1);">
      <div class="app-icon">⚡</div>
      <div class="app-info">
        <div class="app-name">App 3</div>
        <div class="app-desc">قريباً</div>
      </div>
      <span class="app-status status-soon">قريباً</span>
      <span class="arrow">←</span>
    </a>

    <!-- App 4 -->
    <a href="./app4/" class="app-card" style="--card-color:#ef4444; --icon-bg:rgba(239,68,68,0.1);">
      <div class="app-icon">🚀</div>
      <div class="app-info">
        <div class="app-name">App 4</div>
        <div class="app-desc">قريباً</div>
      </div>
      <span class="app-status status-soon">قريباً</span>
      <span class="arrow">←</span>
    </a>

  </div>

  <footer>
    <p>© 2025 <strong>Ovixtik</strong> — جميع الحقوق محفوظة</p>
  </footer>

</div>
</body>
</html>
